[project]
name = "readback"
version = "0.1.0"
description = "Catches readback errors between air traffic controllers and pilots, using Meta's Muse models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "jiwer>=3.0",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "uvicorn>=0.30",
]

[project.scripts]
readback-ui = "readback.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
modal = [
    "modal>=1.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
